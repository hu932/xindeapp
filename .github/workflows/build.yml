name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
          cache-read-only: false

      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --warning-mode all

      - name: Show errors on failure
        if: failure()
        run: |
          echo "===== APK 目录 ====="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "无产物"
          echo "===== 构建报告 ====="
          find . -path "*build/reports*" -name "*.html" 2>/dev/null | head -20 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskHelper-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/reports/**
          retention-days: 7
