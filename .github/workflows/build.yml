name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
          cache-read-only: false

      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      # 把完整输出落到文件，避免 Actions 日志截断把 e: 行吃掉
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --warning-mode all 2>&1 | tee build.log
        continue-on-error: true

      # 单独把 Kotlin 编译错误打出来，这是最有信息量的部分
      - name: Show Kotlin compile errors
        if: always()
        run: |
          echo "════════ Kotlin 编译错误 ════════"
          grep -E "^e: " build.log | head -80 || echo "（没有 e: 行）"
          echo ""
          echo "════════ 其他错误 ════════"
          grep -E "error:|FAILED|Caused by" build.log | head -40 || echo "（无）"
          echo ""
          echo "════════ 任务失败点 ════════"
          grep -E "> Task .* FAILED" build.log | head -20 || echo "（无）"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskHelper-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Fail if build failed
        if: always()
        run: |
          if grep -q "BUILD SUCCESSFUL" build.log; then
            echo "构建成功"
          else
            echo "构建失败"
            exit 1
          fi
