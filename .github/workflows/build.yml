name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
          cache-read-only: false

      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --warning-mode all 2>&1 | tee build.log
        continue-on-error: true

      # 分三段打印，确保不管哪类错误都能看到
      - name: "1. Kotlin errors (e: lines)"
        if: always()
        run: |
          echo "════════ Kotlin 编译错误 ════════"
          grep -E "^e: " build.log | head -100 || echo "（没有 e: 行）"

      - name: "2. Gradle failures"
        if: always()
        run: |
          echo "════════ Gradle 失败点 ════════"
          grep -E "> Task .*FAILED|FAILURE:|What went wrong|error:|Could not|Unresolved|Caused by" build.log | head -60 || echo "（无）"

      - name: "3. Tail of build log"
        if: always()
        run: |
          echo "════════ build.log 最后 150 行 ════════"
          tail -150 build.log || echo "（build.log 不存在）"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskHelper-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
