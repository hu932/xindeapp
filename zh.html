<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>账号管理</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --text:#1c2430; --muted:#8a94a3;
    --line:#e6e9ee; --blue:#2f6bff; --green:#12a66a; --red:#e5484d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px calc(30px + env(safe-area-inset-bottom))}

  /* top */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(16px + env(safe-area-inset-top)) 16px 14px;max-width:560px;margin:0 auto}
  .top h1{margin:0;font-size:19px}
  .top .sub{font-size:12px;color:var(--muted)}
  .clear-btn{min-height:34px;padding:0 14px;border:1px solid #f2c8ca;color:var(--red);
    background:#fdf0f0;border-radius:9px;font-size:13px}

  /* stats */
  .stats{display:flex;gap:10px;margin:4px 0 14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px;text-align:center}
  .stat b{display:block;font-size:24px;line-height:1}
  .stat b.total{color:var(--blue)} .stat b.used{color:var(--green)}
  .stat span{font-size:12px;color:var(--muted)}

  /* input card */
  .input-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .input-card textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);
    border-radius:10px;background:#fafbfc;padding:10px;font-size:12.5px;line-height:1.6;outline:none;
    font-family:ui-monospace,Consolas,Menlo,monospace}
  .input-card textarea:focus{border-color:var(--blue)}
  .row{display:flex;gap:8px;margin-top:10px}
  .row button,.row label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    min-height:42px;border-radius:10px;font-size:14px;font-weight:600}
  .btn-parse{background:var(--blue);color:#fff}
  .btn-file{background:#f1f4f9;color:#3c4757;border:1px solid var(--line)}
  #file{display:none}

  /* list */
  .list-title{margin:20px 2px 10px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
  .empty{padding:46px 10px;text-align:center;color:#b3bac5;font-size:14px}
  .acc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .acc+.acc{margin-top:10px}
  .acc-top{display:flex;align-items:center;gap:11px}
  .num{font-size:13px;font-weight:700;color:var(--muted);min-width:26px}
  .uid{flex:1;min-width:0;font-size:15px;font-weight:700;letter-spacing:.3px;word-break:break-all}
  .meta{font-size:12px;color:var(--muted);margin-top:3px;word-break:break-all}
  .copy-btn{min-height:38px;padding:0 14px;border-radius:9px;background:#eef3ff;color:var(--blue);
    font-size:13px;font-weight:600;flex:0 0 auto}
  .copy-btn:active{background:#dbe7ff}
  .usage{display:none;align-items:center;gap:7px;margin-top:10px;padding:7px 10px;
    background:#eefaf4;border:1px solid #d2f0e2;border-radius:9px;font-size:13px;color:#0b7a4b}
  .usage.show{display:flex}
  .usage .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:p 1.1s infinite}
  .usage .t{font-weight:700;font-variant-numeric:tabular-nums}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}

  /* share status（顶部小状态，点击可手动同步） */
  .share-status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
    margin-top:4px;cursor:pointer;user-select:none}
  .share-status .sd{width:7px;height:7px;border-radius:50%;background:#c3cad6;flex:0 0 auto}
  .share-status.ok{color:var(--green)} .share-status.ok .sd{background:var(--green)}
  .share-status.err{color:var(--red)} .share-status.err .sd{background:var(--red)}
  .share-status.syncing{color:var(--blue)} .share-status.syncing .sd{background:var(--blue);animation:p 1.1s infinite}

  /* tabs：本地 / 共享 */
  .tabs{display:flex;gap:6px;background:#eaeef3;border-radius:11px;padding:4px;margin:2px 0 12px}
  .tab{flex:1;min-height:40px;border-radius:8px;font-size:14px;font-weight:700;color:#6b7480;
    display:flex;align-items:center;justify-content:center;gap:6px}
  .tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(20,30,50,.1)}
  .tab .n{font-size:12px;font-weight:700;opacity:.6;font-variant-numeric:tabular-nums}
  .tab.on .n{opacity:1}
  .del-btn{flex:0 0 auto;width:36px;min-height:38px;padding:0;border-radius:9px;background:#fdf0f0;color:var(--red);
    font-size:15px;font-weight:700;line-height:1;border:1px solid #f2c8ca}
  .del-btn:active{background:#fbe1e2}

  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);
    background:#182030;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:84vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #status{margin:10px 2px 0;min-height:16px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>账号管家</h1>
    <div class="sub">粘贴即解析 · 复制即计时</div>
    <div class="share-status" id="shareStatus" title="点击立即同步"><span class="sd"></span><span id="shareText">本地模式</span></div>
  </div>
  <button class="clear-btn" id="clearBtn">清空</button>
</div>

<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab" data-tab="local">本地<span class="n" id="tabLocalN">0</span></button>
    <button class="tab on" data-tab="shared">共享<span class="n" id="tabSharedN">0</span></button>
  </div>

  <div class="stats">
    <div class="stat"><b class="total" id="statTotal">0</b><span>账号总数</span></div>
    <div class="stat"><b class="used" id="statUsed">0</b><span>已使用</span></div>
  </div>

  <div class="input-card">
    <textarea id="source" spellcheck="false" placeholder=""></textarea>
    <p id="status">等待导入…</p>
    <div class="row">
      <label class="btn-file" for="file">📂 导入文件</label>
      <button class="btn-parse" id="parseBtn">解析</button>
    </div>
    <input id="file" type="file" accept=".txt,.json,text/plain,application/json" />
  </div>

  <div class="list-title"><span id="listTitle">账号列表</span><span id="listInfo">0 个</span></div>
  <div id="list"><div class="empty">暂无账号，粘贴数据后自动解析</div></div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';
/* ===== 共享接口地址：共享标签页的数据存在这里，不需要密码 ===== */
const SHARE_URL='http://103.146.231.72:2036/accounts_share.php';

const LS_LOCAL='fb_local_v1', LS_SHARED='fb_shared_v1', LS_OLD='fb_accounts_v3', REM_KEY='fb_removed_v1';
const $=id=>document.getElementById(id);
const source=$('source'), file=$('file'), list=$('list'), statusEl=$('status');
let tab='shared';                                  // 当前标签页：local | shared
let data={local:[],shared:[]};                     // 本地列表 / 共享列表
let removedKeys=[];                                // 待同步的删除记录
const cur=()=>data[tab];
const rid=()=>'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const keyOf=r=>r.uid?('u:'+r.uid):('i:'+(r.id||''));
const touch=r=>{r.updatedAt=Date.now();};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dur=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?pad(h)+':'+pad(m)+':'+pad(s%60):pad(m)+':'+pad(s%60)};
const clock=ts=>{const d=new Date(ts);return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
function setStatus(m,ok){statusEl.textContent=m||'';statusEl.style.color=ok?ok==='err'?'#e5484d':'#12a66a':'#8a94a3';}
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext!==false){await navigator.clipboard.writeText(t);return true;}}catch(e){}try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok;}catch(e){return false;}}

/* ---------- parse ---------- */
function scan(text){const out=[];let s=-1,d=0,q=false,esc=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')q=false;continue;}if(c==='"')q=true;else if(c==='['){if(d===0)s=i;d++;}else if(c===']'){d--;if(d===0&&s>=0){out.push({s,e:i+1});s=-1;}}}return out;}
function isCookie(v){return v&&typeof v==='object'&&!Array.isArray(v)&&('name'in v||'value'in v||'domain'in v);}
function toCookies(v){if(!Array.isArray(v))return null;if(v.length&&v.every(isCookie))return v;if(v.length&&v.every(x=>Array.isArray(x)&&x.every(isCookie)))return v.flat();return null;}
function tryParse(raw){const arr=[raw];if(/\\_/.test(raw))arr.push(raw.replace(/\\_/g,'_'));for(const c of arr){try{return JSON.parse(c);}catch(e){}}return null;}
function parse(text){
  text=String(text).replace(/\r\n?/g,'\n');const found=scan(text),out=[];let skip=0;
  for(const f of found){
    const cookies=toCookies(tryParse(text.slice(f.s,f.e)));if(!cookies){skip++;continue;}
    const ls=text.lastIndexOf('\n',f.s-1)+1, le=text.indexOf('\n',f.e)>=0?text.indexOf('\n',f.e):text.length;
    const line=text.slice(ls,le),relS=f.s-ls,relE=f.e-ls;
    // columns split by tab
    let cstart=0,idx=-1;const segs=[];
    line.split('\t').forEach(p=>{segs.push({s:cstart,e:cstart+p.length,txt:p});cstart+=p.length+1;});
    for(let k=0;k<segs.length;k++){const c=segs[k];if(c.s<=relS&&relE<=Math.max(c.e,c.s)){idx=k;break;}}
    const pre=idx>0?segs.slice(0,idx).map(c=>c.txt.trim()).filter(Boolean):[];
    const post=idx>=0?segs.slice(idx+1).map(c=>c.txt.trim()).filter(Boolean):[];
    const cu=cookies.find(c=>String(c.name).toLowerCase()==='c_user');
    let uid=cu?String(cu.value).trim():'';if(!uid&&pre.length)uid=pre[0];
    let ua='',region='';
    if(post.length>=2){region=post[post.length-1];ua=post.slice(0,-1).join(' ');}
    else if(post.length===1){if(/mozilla|applewebkit|android|chrome|windows|iphone/i.test(post[0]))ua=post[0];else region=post[0];}
    out.push({id:rid(),uid,cookies,ua,region,usedAt:null,updatedAt:Date.now()});
  }
  return{accounts:out,skip};
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#tabs .tab').forEach(el=>el.classList.toggle('on',el.dataset.tab===tab));
  $('tabLocalN').textContent=data.local.length;
  $('tabSharedN').textContent=data.shared.length;
  const recs=cur();
  $('statTotal').textContent=recs.length;
  $('statUsed').textContent=recs.filter(r=>r.usedAt).length;
  $('listInfo').textContent=recs.length+' 个';
  $('listTitle').textContent=tab==='local'?'本地账号（只存这台设备）':'共享账号（打开这页的所有人都能看到）';
  if(!recs.length){
    list.innerHTML='<div class="empty">'+(tab==='local'?'本地还没有账号，粘贴数据后点「解析」':'共享里还没有账号，粘贴数据后点「解析」')+'</div>';
    return;
  }
  list.innerHTML=recs.map((r,i)=>{
    const meta=[(r.cookies?r.cookies.length:0)+' 个 Cookie',r.region].filter(Boolean).join(' · ');
    return `<div class="acc" data-idx="${i}">
      <div class="acc-top">
        <div class="num">#${i+1}</div>
        <div style="flex:1;min-width:0">
          <div class="uid">${r.uid?esc(r.uid):'<span style="color:#b3bac5">未识别</span>'}</div>
          <div class="meta">${esc(meta)}</div>
        </div>
        <button class="copy-btn" data-copy="${i}">复制</button>
        <button class="del-btn" data-del="${i}" title="删除这个账号">✕</button>
      </div>
      <div class="usage${r.usedAt?' show':''}">
        <span class="dot"></span><span>使用时间</span><span class="t" data-timer="${i}">${r.usedAt?dur(Date.now()-r.usedAt):''}</span>
        <span style="color:#0b7a4b">${r.usedAt?'('+esc(clock(r.usedAt))+' 起)':''}</span>
      </div>
    </div>`;
  }).join('');
  tick();
}
function tick(){cur().forEach((r,i)=>{if(!r.usedAt)return;const n=document.querySelector(`[data-timer="${i}"]`);if(n)n.textContent=dur(Date.now()-r.usedAt);});}
function doParse(){
  const raw=source.value.trim();if(!raw){setStatus('请先粘贴内容');return;}
  const {accounts,skip}=parse(raw);
  const old=new Map(cur().map(r=>[keyOf(r),r]));
  accounts.forEach(a=>{
    const o=old.get(keyOf(a));
    if(o){a.usedAt=o.usedAt;a.updatedAt=o.updatedAt||Date.now();}
  });
  if(tab==='local')data.local=accounts; else data.shared=accounts;
  render();saveAll();
  if(tab==='shared')pushSoon();
  setStatus(accounts.length?`已识别 ${accounts.length} 个账号${skip?'，跳过 '+skip+' 段无效':''}`:skip?'未识别到有效账号':'未识别到账号',accounts.length?'ok':'err');
}
function saveAll(){
  try{
    localStorage.setItem(LS_LOCAL,JSON.stringify(data.local));
    localStorage.setItem(LS_SHARED,JSON.stringify(data.shared));
    localStorage.setItem(REM_KEY,JSON.stringify(removedKeys));
  }catch(e){}
}
function normalize(arr){
  return (Array.isArray(arr)?arr:[]).filter(r=>r&&Array.isArray(r.cookies)).map(r=>({
    id:r.id||rid(),uid:r.uid||'',cookies:r.cookies,ua:r.ua||'',region:r.region||'',
    usedAt:r.usedAt||null,updatedAt:r.updatedAt||Date.now()
  }));
}
function restore(){
  try{
    data.local=normalize(JSON.parse(localStorage.getItem(LS_LOCAL)||'[]'));
    data.shared=normalize(JSON.parse(localStorage.getItem(LS_SHARED)||'[]'));
    // 兼容旧版：旧数据只有一份列表，归到「共享」
    if(!data.local.length&&!data.shared.length)data.shared=normalize(JSON.parse(localStorage.getItem(LS_OLD)||'[]'));
    removedKeys=JSON.parse(localStorage.getItem(REM_KEY)||'[]')||[];
  }catch(e){data={local:[],shared:[]};removedKeys=[];}
}

/* ---------- 共享同步：只有「共享」标签页的数据会走服务器 ---------- */
let pushing=false,pushAgain=false;
function setShare(state,text){$('shareStatus').className='share-status'+(state?' '+state:'');$('shareText').textContent=text;}
function api(body,timeoutMs){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),timeoutMs||20000);
  return fetch(SHARE_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body),signal:ctl.signal}).then(r=>r.json()).finally(()=>clearTimeout(t));
}
function sig(){return data.shared.map(r=>keyOf(r)+':'+(r.updatedAt||0)+':'+(r.usedAt||0)).sort().join('|');}
function adoptShared(list){
  const map=new Map(data.shared.map(r=>[keyOf(r),r]));
  (list||[]).forEach(s=>{
    if(!s||!Array.isArray(s.cookies)||!s.cookies.length)return;
    const k=keyOf(s),local=map.get(k);
    const inc={id:s.id||rid(),uid:s.uid||'',cookies:s.cookies,ua:s.ua||'',region:s.region||'',
      usedAt:s.usedAt||null,updatedAt:s.updatedAt||0};
    if(!local)map.set(k,inc);
    else if((inc.updatedAt||0)>(local.updatedAt||0))Object.assign(local,inc);
  });
  data.shared=[...map.values()];
}
function fail(e){return (e&&e.name==='AbortError')?'超时':((e&&e.message)||String(e));}
async function pull(quiet){
  try{
    if(!quiet)setShare('syncing','同步中…');
    const r=await api({act:'list'});
    if(!r||!r.ok)throw new Error((r&&r.msg)||'返回异常');
    const before=sig();
    adoptShared(r.data);
    if(sig()!==before){saveAll();if(tab==='shared')render();}
    setShare('ok','已同步 '+(r.updated_at||'').slice(11,16));
  }catch(e){setShare('err','读取失败：'+fail(e));}
}
async function push(){
  if(pushing){pushAgain=true;return;}
  pushing=true;
  try{
    setShare('syncing','上传中…');
    const removed=removedKeys.filter(k=>!data.shared.some(r=>keyOf(r)===k));
    const payload=data.shared.map(r=>({id:r.id,uid:r.uid,cookies:r.cookies,ua:r.ua,region:r.region,
      usedAt:r.usedAt,updatedAt:r.updatedAt}));
    const r=await api({act:'sync',accounts:payload,removed:removed});
    if(!r||!r.ok)throw new Error((r&&r.msg)||'返回异常');
    removedKeys=[];try{localStorage.removeItem(REM_KEY);}catch(e){}
    adoptShared(r.data);saveAll();if(tab==='shared')render();
    setShare('ok','已同步 '+(r.updated_at||'').slice(11,16));
  }catch(e){setShare('err','上传失败：'+fail(e));}
  finally{pushing=false;if(pushAgain){pushAgain=false;push();}}
}
let pt;function pushSoon(){clearTimeout(pt);pt=setTimeout(push,700);}
function markRemoved(k){if(k)removedKeys.push(k);}

/* events */
let db;source.addEventListener('input',()=>{clearTimeout(db);db=setTimeout(doParse,500);});
$('parseBtn').addEventListener('click',doParse);

// 标签页切换：本地 / 共享
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');if(!b||b.dataset.tab===tab)return;
  tab=b.dataset.tab;render();
  if(tab==='shared')pull(true);   // 切到共享时顺便拉一次最新的
});

$('clearBtn').addEventListener('click',async ()=>{
  const recs=cur();
  if(!recs.length){toast('已经是空的');return;}
  const isShared=tab==='shared';
  if(!confirm('确定清空'+(isShared?'共享里':'本地')+'的 '+recs.length+' 个账号？'+(isShared?'\n（服务器上的也会一起清空）':'')))return;
  source.value='';file.value='';
  if(isShared){
    recs.forEach(r=>markRemoved(keyOf(r)));
    data.shared=[];render();saveAll();
    try{const r=await api({act:'clear'});if(r&&r.ok){adoptShared(r.data);saveAll();render();}}catch(e){setShare('err','清空失败：'+fail(e));}
    setShare('ok','已清空');
  }else{
    data.local=[];render();saveAll();
  }
  setStatus('已清空');toast('已清空');
});

file.addEventListener('change',()=>{
  const f=file.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{source.value=String(rd.result||'');doParse();};
  rd.onerror=()=>setStatus('文件读取失败','err');
  rd.readAsText(f);
});

list.addEventListener('click',async e=>{
  const recs=cur();
  const del=e.target.closest('[data-del]');
  if(del){
    const i=+del.dataset.del,r=recs[i];if(!r)return;
    if(!confirm('删除账号 '+(r.uid||'#'+(i+1))+' ？'))return;
    recs.splice(i,1);
    if(tab==='shared'){markRemoved(keyOf(r));pushSoon();}
    render();saveAll();toast('已删除');
    return;
  }
  const b=e.target.closest('[data-copy]');if(!b)return;
  const i=+b.dataset.copy,r=recs[i];if(!r)return;
  const ok=await copyText(JSON.stringify(r.cookies));
  if(!ok){setStatus('复制失败','err');return;}
  r.usedAt=Date.now();touch(r);
  render();saveAll();
  if(tab==='shared')pushSoon();
  setStatus(`已复制 ${r.uid||'#'+(i+1)}，开始计时`);
  toast('已复制，开始计时 ⏱');
});
setInterval(tick,1000);

// 顶部状态：点一下立即同步
$('shareStatus').addEventListener('click',async ()=>{
  await pull(false);await push();
  toast('已同步');
});

restore();
render();
setShare('syncing','同步中…');
pull(true).then(()=>push());
setInterval(()=>pull(true),15000);   // 每 15 秒拉一次，别人改的也能看到
})();
</script>
</body>
</html>
